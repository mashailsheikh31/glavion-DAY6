<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Enterprise Attendance Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./js/script.js" defer></script>
  <script src="./js/auth.js"></script>
</head>
<body class="auth-page">
  <div id="toast-container"></div>
<div class="auth-container">
  <!-- Auth Header -->
  <div class="auth-header">
    <h2 id="auth-title">Welcome Back</h2>
    <p id="auth-subtitle">Please enter your credentials to log in.</p>
  </div>

  <!-- Error / Success Alert -->
  <div id="error-msg" class="alert alert-danger" style="display: none;"></div>

  <!-- Sign In Form -->
  <form id="login-form">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" class="form-control" placeholder="intern@glavion.com" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" class="form-control" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
  </form>

  <!-- Sign Up Form (Initially Hidden) -->
  <form id="signup-form" style="display: none;">
    <div class="form-group">
      <label for="signup-name">Full Name</label>
      <input type="text" id="signup-name" class="form-control" placeholder="Your Name" required>
    </div>
    <div class="form-group">
      <label for="signup-email">Email Address</label>
      <input type="email" id="signup-email" class="form-control" placeholder="intern@glavion.com" required>
    </div>
    <div class="form-group">
      <label for="signup-password">Password</label>
      <input type="password" id="signup-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
  </form>

  <!-- Toggle Links -->
  <div class="auth-footer" style="margin-top: 1.25rem; text-align: center;">
    <p id="toggle-to-signup">Don't have an account? <a href="#" id="show-signup-btn">Sign Up</a></p>
    <p id="toggle-to-login" style="display: none;">Already have an account? <a href="#" id="show-login-btn">Sign In</a></p>
  </div>
</div>

  <script src="js/script.js"></script>
</body>
</html>
